name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Create release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          echo "=== Bundle directory contents ==="
          find "$BUNDLE_DIR" -type f 2>/dev/null || echo "BUNDLE_DIR not found"

          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          TAR=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" | head -1)

          if [ -z "$DMG" ]; then
            echo "ERROR: DMG not found"; exit 1
          fi
          if [ -z "$TAR" ]; then
            echo "ERROR: .app.tar.gz not found — check createUpdaterArtifacts: true in tauri.conf.json"; exit 1
          fi
          if [ ! -f "${TAR}.sig" ]; then
            echo "ERROR: .sig not found at ${TAR}.sig"; exit 1
          fi

          TAR_NAME=$(basename "$TAR")
          SIG=$(cat "${TAR}.sig")
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/RamzThunder/on-diary/releases/download/${TAG}/${TAR_NAME}"

          echo "DMG: $DMG"
          echo "TAR: $TAR"
          echo "SIG: ${TAR}.sig"
          echo "VERSION: $VERSION"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "dida 새 버전이 업데이트되었습니다." \
            --arg pub_date "$DATE" \
            --arg sig "$SIG" \
            --arg url "https://github.com/RamzThunder/dida-releases/releases/download/${TAG}/${TAR_NAME}" \
            '{"version":$version,"notes":$notes,"pub_date":$pub_date,"platforms":{"darwin-aarch64":{"signature":$sig,"url":$url}}}' \
            > latest.json

          cat latest.json

          # 기존 릴리즈 있으면 삭제 (force-push 재빌드 대응)
          GH_TOKEN="${{ secrets.RELEASES_PAT }}" gh release delete "$TAG" \
            --repo RamzThunder/dida-releases --yes 2>/dev/null || true

          GH_TOKEN="${{ secrets.RELEASES_PAT }}" gh release create "$TAG" "$DMG" "$TAR" "${TAR}.sig" latest.json \
            --repo RamzThunder/dida-releases \
            --title "dida $TAG" \
            --notes "dida 새 버전이 출시되었습니다."
