name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    outputs:
      tar_name: ${{ steps.info.outputs.tar_name }}
      tar_sig: ${{ steps.info.outputs.tar_sig }}
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: npm install

      - name: Build (macOS aarch64)
        run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Add install guide to DMG
        run: |
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Found DMG: $DMG"
          hdiutil convert "$DMG" -format UDRW -o /tmp/pandecki_rw.dmg
          hdiutil attach /tmp/pandecki_rw.dmg -mountpoint /tmp/pandecki_mount -nobrowse -quiet
          cp "scripts/설치 방법.txt" "/tmp/pandecki_mount/설치 방법.txt"
          hdiutil detach /tmp/pandecki_mount -quiet
          hdiutil convert /tmp/pandecki_rw.dmg -format UDZO -imagekey zlib-level=9 -o /tmp/pandecki_final.dmg
          mv /tmp/pandecki_final.dmg "$DMG"

      - id: info
        run: |
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          TAR=$(find "$BUNDLE/macos" -name "*.app.tar.gz" | head -1)
          echo "tar_name=$(basename $TAR)" >> $GITHUB_OUTPUT
          echo "tar_sig=$(cat ${TAR}.sig)" >> $GITHUB_OUTPUT

      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp "$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)" staging/
          cp "$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -1)" staging/
          cp "$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app.tar.gz.sig' | head -1)" staging/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: staging/

  build-windows:
    runs-on: windows-latest
    outputs:
      win_exe_name: ${{ steps.info.outputs.win_exe_name }}
      win_sig: ${{ steps.info.outputs.win_sig }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: npm install

      - name: Build (Windows x86_64)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - id: info
        shell: bash
        run: |
          # Tauri v2: createUpdaterArtifacts:true → .exe + .exe.sig (no zip)
          SIG=$(find src-tauri/target -path "*/bundle/nsis/*.exe.sig" 2>/dev/null | head -1)
          [ -z "$SIG" ] && SIG=$(find src-tauri/target -path "*/bundle/msi/*.msi.sig" 2>/dev/null | head -1)
          if [ -z "$SIG" ]; then echo "ERROR: no updater sig found"; exit 1; fi
          WIN_FILE="${SIG%.sig}"
          echo "Found: $WIN_FILE"
          echo "win_exe_name=$(basename $WIN_FILE)" >> $GITHUB_OUTPUT
          echo "win_sig=$(cat $SIG)" >> $GITHUB_OUTPUT

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging
          for ext in "*.exe" "*.exe.sig" "*.msi" "*.msi.sig"; do
            find src-tauri/target -path "*/bundle/*" -name "$ext" -exec cp {} staging/ \; 2>/dev/null || true
          done
          echo "=== Staged files ==="
          ls staging/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: staging/

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}

      - name: Download artifacts
        run: |
          mkdir -p artifacts/macos artifacts/windows
          gh run download ${{ github.run_id }} -n macos-artifacts -D artifacts/macos
          gh run download ${{ github.run_id }} -n windows-artifacts -D artifacts/windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          MAC_TAR="${{ needs.build-macos.outputs.tar_name }}"
          MAC_SIG="${{ needs.build-macos.outputs.tar_sig }}"
          WIN_EXE="${{ needs.build-windows.outputs.win_exe_name }}"
          WIN_SIG="${{ needs.build-windows.outputs.win_sig }}"

          echo "=== Artifacts ==="
          ls artifacts/macos/ artifacts/windows/

          jq -n \
            --arg version "$VERSION" \
            --arg notes "PanDeckI 새 버전이 업데이트되었습니다." \
            --arg pub_date "$DATE" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "${BASE_URL}/${MAC_TAR}" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "${BASE_URL}/${WIN_EXE}" \
            '{"version":$version,"notes":$notes,"pub_date":$pub_date,"platforms":{
              "darwin-aarch64":{"signature":$mac_sig,"url":$mac_url},
              "windows-x86_64":{"signature":$win_sig,"url":$win_url}
            }}' > latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release delete "$TAG" \
            --repo "${{ github.repository }}" --yes 2>/dev/null || true

          gh release create "$TAG" \
            artifacts/macos/*.dmg \
            artifacts/macos/*.app.tar.gz \
            artifacts/macos/*.app.tar.gz.sig \
            artifacts/windows/* \
            latest.json \
            --repo "${{ github.repository }}" \
            --title "PanDeckI $TAG" \
            --notes "PanDeckI 새 버전이 출시되었습니다."
