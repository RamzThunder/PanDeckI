name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Create release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          TAR=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" | head -1)
          TAR_NAME=$(basename "$TAR")
          SIG=$(cat "${TAR}.sig")
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/RamzThunder/on-diary/releases/download/${TAG}/${TAR_NAME}"

          echo "DMG: $DMG"
          echo "TAR: $TAR"
          echo "VERSION: $VERSION"

          gh release create "$TAG" "$DMG" "$TAR" \
            --title "dida $TAG" \
            --notes "dida 새 버전이 출시되었습니다."

          jq -n \
            --arg version "$VERSION" \
            --arg notes "dida 새 버전이 업데이트되었습니다." \
            --arg pub_date "$DATE" \
            --arg sig "$SIG" \
            --arg url "$URL" \
            '{"version":$version,"notes":$notes,"pub_date":$pub_date,"platforms":{"darwin-aarch64":{"signature":$sig,"url":$url}}}' \
            > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json
