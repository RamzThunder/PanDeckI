name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'On Diary ${{ github.ref_name }}'
          releaseBody: |
            On Diary 새 버전이 출시되었습니다.

            **macOS 최초 실행 시**: 앱을 우클릭 → 열기 를 선택하세요.
            "손상된 파일" 오류가 뜨면 터미널에서 아래 명령어를 실행하세요:
            ```
            xattr -dr com.apple.quarantine "/Applications/On Diary.app"
            ```
            이후 버전은 자동으로 업데이트됩니다.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
